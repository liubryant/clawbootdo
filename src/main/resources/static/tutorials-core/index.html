<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">玩机手册</title>
<style>
@font-face { font-family: 'MiSans'; font-weight: 400; src: url('./fonts/MiSans-Regular.woff2') format('woff2'); font-display: optional; }
@font-face { font-family: 'MiSans'; font-weight: 500; src: url('./fonts/MiSans-Medium.woff2') format('woff2'); font-display: optional; }
@font-face { font-family: 'MiSans'; font-weight: 600; src: url('./fonts/MiSans-Semibold.woff2') format('woff2'); font-display: optional; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #000; font-family: 'MiSans', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.page { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; }
.canvas { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; background: #000; }
.bg-panel { position: absolute; left: 40px; top: 40px; width: 1840px; height: 1000px; border-radius: 56px; border: 2px solid rgba(255,255,255,0.25); background: #f6f6f6 url('./images/Tutorial Content.png') center / cover no-repeat; overflow: hidden; }
.top-pill { position: absolute; left: 120px; top: 120px; display: inline-flex; align-items: center; gap: 8px; padding: 17px 21px; background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.06); border-radius: 9999px; }
.top-pill .icon { width: 20px; height: 20px; display: inline-block; }
.top-pill .icon svg { width: 100%; height: 100%; display: block; }
.top-pill .label { font-size: 20px; font-weight: 400; color: #3978f3; line-height: 1; white-space: nowrap; }
.top-tip { position: absolute; left: 372px; top: 137px; font-size: 20px; font-weight: 400; color: #86868b; line-height: 20px; white-space: nowrap; }
.lang-switch { position: absolute; right: 120px; top: 120px; display: inline-flex; align-items: center; padding: 6px; background: rgba(255,255,255,0.78); border: 1px solid rgba(0,0,0,0.06); border-radius: 999px; gap: 4px; }
.lang-switch button { min-width: 64px; height: 40px; border: 0; border-radius: 999px; background: transparent; color: #6e6e73; font: inherit; font-size: 18px; cursor: pointer; }
.lang-switch button.active { background: #1d1d1f; color: #fff; }
.title { position: absolute; left: 120px; top: 202px; width: 860px; }
.title h1 { font-size: 80px; font-weight: 500; color: #1d1d1f; line-height: 1.22; letter-spacing: 0; }
.title p { font-size: 28px; font-weight: 400; color: #6e6e73; line-height: 1.38; margin-top: 6px; }
.card { position: absolute; left: 120px; top: 383px; width: 540px; height: 560px; background: #fff; border-radius: 48px; overflow: hidden; cursor: pointer; transition: transform .25s ease; text-decoration: none; color: inherit; }
.card:hover { transform: translateY(-4px); }
.card .img-stack { position: relative; width: 540px; height: 320px; overflow: hidden; }
.card .img-stack img { position: absolute; left: 0; top: 0; width: 540px; height: 320px; object-fit: cover; display: block; }
.card .img-stack .layer-2 { z-index: 1; }
.card .img-stack .layer-1 { z-index: 2; width: 313px; height: 261px; left: 50%; top: 50%; transform: translate(-50%, -50%); object-fit: contain; }
.card .text { position: absolute; left: 40px; top: 360px; width: 460px; display: flex; flex-direction: column; gap: 16px; }
.card .text h2 { font-size: 40px; font-weight: 500; color: #1d1d1f; line-height: 1.12; letter-spacing: 0; }
.card .text .desc { font-size: 24px; font-weight: 400; color: #000; opacity: 0.5; line-height: 1.4; width: 460px; }

@media (max-width: 480px) {
  html, body { overflow-x: hidden; overflow-y: auto; height: auto; min-height: 100%; background: #000; }
  .page { position: static; width: 100%; height: auto; overflow: visible; }
  .canvas { position: relative; left: auto; top: auto; width: 100%; height: auto; transform: none !important; padding: 20px 16px 24px; background: transparent; min-height: 100vh; }
  .bg-panel { position: fixed; left: 0; top: 0; right: 0; bottom: 0; width: 100%; height: 100%; border-radius: 0; border: 0; background: #f6f6f6 url('./images/Tutorial Content.png') center / cover no-repeat; z-index: 0; }
  .top-pill { position: relative; left: auto; top: auto; padding: 8px 14px; gap: 6px; z-index: 2; }
  .top-pill .icon { width: 16px; height: 16px; }
  .top-pill .label { font-size: 14px; }
  .top-tip { display: none; }
  .lang-switch { position: absolute; right: 16px; top: 20px; padding: 4px; z-index: 3; }
  .lang-switch button { min-width: 44px; height: 30px; font-size: 13px; }
  .title { position: relative; left: auto; top: auto; margin-top: 12px; z-index: 2; width: auto; padding-right: 12px; }
  .title h1 { font-size: 36px; line-height: 1.2; }
  .title p { font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .card { position: relative; left: auto; top: auto; width: 100%; height: auto; margin-top: 16px; margin-bottom: 16px; border-radius: 24px; min-height: 44px; display: block; z-index: 2; }
  .card:hover { transform: none; }
  .card .img-stack { position: relative; width: 100%; height: auto; aspect-ratio: 540 / 320; overflow: hidden; }
  .card .img-stack .layer-2 { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .img-stack .layer-1 { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 58%; height: auto; max-height: 82%; object-fit: contain; }
  .card .text { position: relative; left: auto; top: auto; width: auto; padding: 16px 20px 20px; gap: 6px; display: flex; flex-direction: column; }
  .card .text h2 { font-size: 20px; white-space: normal; line-height: 1.3; }
  .card .text .desc { font-size: 14px; width: auto; line-height: 1.5; opacity: 0.55; }
}
</style>
</head>
<body>
<div class="page">
  <div class="canvas" id="canvas">
    <div class="bg-panel"></div>

    <div class="top-pill">
      <span class="icon">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2.5L12.06 7.44L17.5 8.04L13.42 11.69L14.62 17.04L10 14.27L5.38 17.04L6.58 11.69L2.5 8.04L7.94 7.44L10 2.5Z" fill="#3978f3"/>
        </svg>
      </span>
      <span class="label" data-i18n="guideLabel">Power User Guide</span>
    </div>
    <div class="top-tip" data-i18n="topTip">3 core scenarios / 5 essential interaction methods</div>

    <div class="lang-switch" aria-label="Language">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">EN</button>
    </div>

    <div class="title">
      <h1 data-i18n="heroTitle">玩机手册</h1>
      <p data-i18n="heroDesc">从娱乐、办公到游戏，AR 眼镜带来真正的空间体验，解锁空间智能的进阶秘籍。</p>
    </div>

    <a class="card" href="./main-page.html">
      <div class="img-stack">
        <img class="layer-2" loading="lazy" decoding="async" src="./images/3.2.png" alt="">
        <img class="layer-1" loading="lazy" decoding="async" src="./images/3.1.png" alt="">
      </div>
      <div class="text">
        <h2 data-i18n="cardTitle">核心：五种交互方式</h2>
        <p class="desc" data-i18n="cardDesc">TP02 触控板、语音交互、TP01 触控板等多种交互方式。</p>
      </div>
    </a>
  </div>
</div>

<script>
(function(){
  var messages = {
    zh: {
      pageTitle: '玩家手册',
      guideLabel: 'Power User Guide',
      topTip: '3 大核心场景 / 5 种核心交互方式',
      heroTitle: '玩家手册',
      heroDesc: '从娱乐、办公到游戏，AR 眼镜带来真正的空间体验，解锁空间智能的进阶秘籍。',
      cardTitle: '核心：五种交互方式',
      cardDesc: 'TP02 触控板、语音交互、TP01 触控板等多种交互方式。'
    },
    en: {
      pageTitle: 'User Guide',
      guideLabel: 'Power User Guide',
      topTip: '3 core scenarios / 5 essential interaction methods',
      heroTitle: 'User Guide',
      heroDesc: 'From entertainment and productivity to gaming, AR glasses bring a true spatial experience and unlock advanced spatial intelligence.',
      cardTitle: 'Core: Five Interaction Methods',
      cardDesc: 'Learn touchpad controls, voice interaction, TP01 and TP02 gestures, and more ways to control your glasses.'
    }
  };

  var canvas = document.getElementById('canvas');
  var langButtons = Array.prototype.slice.call(document.querySelectorAll('[data-lang]'));
  var currentLang = null;

  function getQueryLang() {
    var params = new URLSearchParams(window.location.search);
    var queryLang = params.get('lang');
    return (queryLang === 'zh' || queryLang === 'en') ? queryLang : null;
  }

  function getSystemLang() {
    var languages = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language || navigator.userLanguage || ''];
    var primary = (languages[0] || '').toLowerCase();
    return primary.indexOf('zh') === 0 ? 'zh' : 'en';
  }

  function getInitialLang() {
    return getQueryLang() || getSystemLang();
  }

  function setLang(lang) {
    var dict = messages[lang] || messages.zh;
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.title = dict.pageTitle;
    document.querySelectorAll('[data-i18n]').forEach(function(node) {
      var key = node.getAttribute('data-i18n');
      if (dict[key]) node.textContent = dict[key];
    });
    langButtons.forEach(function(button) {
      button.classList.toggle('active', button.getAttribute('data-lang') === lang);
    });
    currentLang = lang;
  }

  function syncSystemLang() {
    if (getQueryLang()) return;
    var systemLang = getSystemLang();
    if (systemLang !== currentLang) setLang(systemLang);
  }

  function fit(){
    if (window.innerWidth <= 480) return;
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    canvas.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  langButtons.forEach(function(button) {
    button.addEventListener('click', function() {
      var lang = button.getAttribute('data-lang');
      var url = new URL(window.location.href);
      url.searchParams.set('lang', lang);
      window.history.replaceState(null, '', url.toString());
      setLang(lang);
    });
  });
  window.addEventListener('resize', fit, { passive: true });
  window.addEventListener('languagechange', syncSystemLang, { passive: true });
  window.addEventListener('focus', syncSystemLang, { passive: true });
  window.addEventListener('pageshow', syncSystemLang, { passive: true });
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) syncSystemLang();
  });
  setInterval(syncSystemLang, 3000);

  setLang(getInitialLang());
  fit();
})();
</script>
</body>
</html>
