<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5>正念音频列表</h5>
                <div class="ibox-tools">
                    <button class="btn btn-default btn-sm" onclick="loadList()"><i class="fa fa-refresh"></i> 刷新</button>
                    <button class="btn btn-primary btn-sm" onclick="openUpload()"><i class="fa fa-upload"></i> 上传音频</button>
                </div>
            </div>
            <div class="ibox-content">
                <div class="alert alert-info">音频保存在服务器磁盘，数据库只保存标题和文件信息。单个文件最大 30MB，支持 MP3、M4A、AAC、WAV、OGG。</div>
                <table class="table table-striped table-bordered">
                    <thead><tr><th width="70">排序</th><th>标题</th><th>原文件名</th><th width="100">大小</th><th width="80">状态</th><th width="210">操作</th></tr></thead>
                    <tbody id="mindfulnessBody"><tr><td colspan="6" class="text-center">加载中…</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:include="include :: footer"></div>
<script src="/js/appjs/ai/mindfulness/mindfulness.js?v=20260821a"></script>
</body>
</html>
