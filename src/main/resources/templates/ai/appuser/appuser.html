<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
    <div class="wrapper wrapper-content animated fadeInRight">
        <div class="col-sm-12">
            <div class="ibox">
                <div class="ibox-body">
                    <div class="fixed-table-toolbar">
                        <div class="columns pull-left" role="group">
                            <button class="btn btn-primary" onclick="add()">
                                <i class="fa fa-plus" aria-hidden="true"></i>新增
                            </button>
                            <button class="btn btn-danger" onclick="batchRemove()">
                                <i class="fa fa-trash" aria-hidden="true"></i>删除
                            </button>
                            <button class="btn btn-warning" onclick="openQuotaConfig()">
                                <i class="fa fa-cog" aria-hidden="true"></i>配置额度
                            </button>
                        </div>
                        <div class="columns pull-right" role="group">
                            <button class="btn btn-success" onclick="reLoad()">
                                <i class="fa fa-search" aria-hidden="true"></i>查询
                            </button>
                        </div>
                        <div class="pull-right search col-md-2">
                            <input id="searchPhone" type="text" class="form-control" placeholder="手机号">
                        </div>
                    </div>
                    <table id="exampleTable" data-mobile-responsive="true"></table>
                </div>
            </div>
        </div>
    </div>
    <div th:include="include :: footer"></div>
    <script type="text/javascript" src="/js/appjs/ai/appuser/appuser.js?v=20260628b"></script>
</body>
</html>
