<!DOCTYPE html>
<html><meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
  <div class="row"><div class="col-sm-12"><div class="ibox">
    <div class="ibox-title"><h5>灵感星球 · 模型管理</h5></div>
    <div class="ibox-content">
      <h4>生成文本 <span class="label label-primary">TEXT</span></h4><hr/>
      <form id="textModelForm" class="form-horizontal model-form" data-type="TEXT">
        <div class="form-group"><label class="col-sm-2 control-label">服务商</label><div class="col-sm-10"><input name="aiProvider" class="form-control" placeholder="doubao"/></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">接口地址</label><div class="col-sm-10"><input name="aiBaseUrl" class="form-control" placeholder="https://ark.cn-beijing.volces.com/api/v3"/></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">API Key</label><div class="col-sm-10"><input name="aiApiKey" type="text" autocomplete="off" class="form-control" placeholder="请输入 API Key"/><span class="key-hint help-block"></span></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">模型</label><div class="col-sm-10"><input name="aiModel" class="form-control" placeholder="doubao-seed-evolving"/></div></div>
        <div class="form-group"><div class="col-sm-offset-2 col-sm-10"><button type="button" class="save-button btn btn-primary"><i class="fa fa-save"></i> 保存生成文本配置</button></div></div>
      </form>

      <h4 style="margin-top:36px">文生视频 <span class="label label-success">VIDEO_TEXT</span></h4><hr/>
      <p class="text-muted">灵感星球 App 专用豆包视频生成配置，不会修改或覆盖原有视频接口。</p>
      <form id="videoModelForm" class="form-horizontal model-form" data-type="VIDEO_TEXT">
        <div class="form-group"><label class="col-sm-2 control-label">服务商</label><div class="col-sm-10"><input name="aiProvider" class="form-control" placeholder="doubao"/></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">接口地址</label><div class="col-sm-10"><input name="aiBaseUrl" class="form-control" placeholder="https://ark.cn-beijing.volces.com/api/v3"/><span class="help-block">可填写 API v3 根地址或完整的 /contents/generations/tasks 地址。</span></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">API Key</label><div class="col-sm-10"><input name="aiApiKey" type="text" autocomplete="off" class="form-control" placeholder="请输入豆包 Ark API Key"/><span class="key-hint help-block"></span></div></div>
        <div class="form-group"><label class="col-sm-2 control-label">模型</label><div class="col-sm-10"><input name="aiModel" class="form-control" placeholder="doubao-seedance-1-5-pro-251215"/><span class="help-block">默认声音需要选择支持有声生成的 Seedance 模型。</span></div></div>
        <div class="form-group"><div class="col-sm-offset-2 col-sm-10"><button type="button" class="save-button btn btn-success"><i class="fa fa-save"></i> 保存文生视频配置</button></div></div>
      </form>
    </div>
  </div></div></div>
</div>
<div th:include="include :: footer"></div>
<script src="/js/appjs/inspireplanet/model_config.js"></script>
</body></html>
