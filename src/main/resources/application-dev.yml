bootdo:
  uploadPath: D:/var/uploaded_files/
logging:
  level:
    root: info
    com.bootdo: debug
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/bootdo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
#    url: jdbc:mysql://124.70.218.113:3306/bootdo?useUnicode=true&characterEncoding=utf8
    username: root
    password: root
    initialSize: 1
    minIdle: 3
    maxActive: 20
    # 配置获取连接等待超时的时间
    maxWait: 60000
    # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
    timeBetweenEvictionRunsMillis: 60000
    # 配置一个连接在池中最小生存的时间，单位是毫秒
    minEvictableIdleTimeMillis: 30000
    validationQuery: select 'x'
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    # 打开PSCache，并且指定每个连接上PSCache的大小
    poolPreparedStatements: true
    maxPoolPreparedStatementPerConnectionSize: 20
    # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
    filters: stat,wall,slf4j
    # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
    # 合并多个DruidDataSource的监控数据
    #useGlobalDataSourceStat: true
  redis:
      host: 127.0.0.1
      port: 6379
      password:
      # 连接超时时间（毫秒）
      timeout: 10000
      pool:
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池中的最小空闲连接
        min-idle: 10
        # 连接池最大连接数（使用负值表示没有限制）
        max-active: 100
        # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1
  data:
    mongodb:
      host: 127.0.0.1
      port: 27017
      database: dbdemo

ai:
  enabled: true
  # 可选：配置后要求客户端带 Authorization: Bearer <gatewayToken>
  gatewayToken:
  connectTimeoutMs: 15000
  readTimeoutMs: 600000
  glm:
    baseUrl: https://open.bigmodel.cn/api/paas/v4
    # 临时固定 key（按你的要求）；后续建议改回环境变量
    apiKey: 099876dd5b834400b0b7c97e231addba.e1mBdIQgNibogCdl
    model: glm-5.1
    imageModel: glm-image
    videoModel: cogvideox-3
    videoQuality: quality
    videoWithAudio: true
    videoSize: 1920x1080
    videoFps: 30
    videoPollIntervalMs: 5000
    videoPollTimeoutMs: 600000
    imageSize: 1280x1280
    imageQuality: hd
    imageWatermarkEnabled: false

    # 动态聊天上游配置：兼容老字段 data.apiKey，也支持：
    # data.aiProvider / data.aiBaseUrl / data.aiApiKey / data.aiModel
    apiInfoUrl: https://www.cjym123.cn/api/info
    # 每 2 分钟拉取一次；只有 key 变化时才会更新内存缓存
    apiKeyRefreshMs: 120000
    # 拉取 /api/info 的超时建议设置短一些，避免卡住刷新线程
    apiInfoConnectTimeoutMs: 2000
    apiInfoReadTimeoutMs: 3000
  siliconflow:
    baseUrl: https://api.siliconflow.cn/v1
    apiKey: sk-hktsoosnxfywormrgsenhwaaexmyrtmhdoftijfpbfpogdxp
    imageEditModel: Qwen/Qwen-Image-Edit-2509
    imageEditSteps: 20
    imageEditCfg: 4

navi:
  auth:
    tokenSecret: local-navi-payment-token-secret-change-before-production
    tokenTtlSeconds: 2592000
  vip:
    # mock: 本地不调用微信、直接置为已支付（旧行为）；wechat: 真实调用微信支付APIv3下单
    mode: wechat
  wechat:
    appId: wx4ac470d6bef3de2f
    merchantId: 1645114257
    # 商户APIv3密钥（32位），通过环境变量注入，不要写进配置文件提交到仓库
    apiV3Key: ${NAVI_WECHAT_API_V3_KEY:}
    # 商户API证书序列号
    merchantSerialNo: ${NAVI_WECHAT_SERIAL_NO:}
    # 商户私钥文件(apiclient_key.pem)路径，相对路径相对于进程启动时的工作目录
    privateKeyPath: ${NAVI_WECHAT_PRIVATE_KEY_PATH:config/wechat/apiclient_key.pem}
    # 必须是 https；本机内网IP微信服务器无法回调，先用真实可解析的域名占位，
    # 本地验证走主动查单(NaviVipService#activelyQueryAndSync)，不依赖此回调真正被触达
    notifyUrl: ${NAVI_WECHAT_NOTIFY_URL:https://www.cjym123.cn/im/bot/navi/vip/notify}
  alipay:
    appId: "2021006167677042"
    # 商户应用私钥文件路径
    privateKeyPath: ${NAVI_ALIPAY_PRIVATE_KEY_PATH:config/alipay/app_private_key.pem}
    # 支付宝公钥文件路径，用于验证支付宝返回/回调的签名
    publicKeyPath: ${NAVI_ALIPAY_PUBLIC_KEY_PATH:config/alipay/alipay_public_key.pem}
    # 同样要求 https，本地验证走主动查单，不依赖此回调真正被触达
    notifyUrl: ${NAVI_ALIPAY_NOTIFY_URL:https://www.cjym123.cn/im/bot/navi/vip/alipay/notify}

agentclaw:
  alipay:
    appId: "2021006169619056"
    privateKeyPath: config/agentclaw/alipay/app_private_key.pem
    publicKeyPath: config/agentclaw/alipay/alipay_public_key.pem
    notifyUrl: https://www.cjym123.cn/im/bot/navi/vip/agentclaw/alipay/notify

